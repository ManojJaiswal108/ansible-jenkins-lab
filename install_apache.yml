---
- name: Install and restart Apache2 using command module
  hosts: webservers
  become: yes

  tasks:

    - name: Update apt repository
      command: apt-get update -y

    - name: Install apache2 package
      command: apt-get install -y apache2

    - name: Change Apache Listen port in ports.conf
      ansible.builtin.lineinfile:
        path: /etc/apache2/ports.conf
        regexp: '^Listen '
        line: 'Listen 8084'

    - name: Change Apache VirtualHost port in default site
      ansible.builtin.lineinfile:
        path: /etc/apache2/sites-available/000-default.conf
        regexp: '<VirtualHost \*:.*>'
        line: '<VirtualHost *:8084>'

    - name: Remove old custom index file if it exists
      ansible.builtin.file:
        path: /var/www/html/index.html
        state: absent

    - name: Deploy the default Apache landing page layout
      ansible.builtin.copy:
        src: /usr/share/apache2/default-site/index.html
        dest: /var/www/html/index.html
        remote_src: true

    - name: Start apache2 service
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: Enable apache2 on boot
      command: systemctl enable apache2

    - name: Restart apache2 service
      command: systemctl restart apache2


